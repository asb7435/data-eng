collection: lecture_kb

embedding:
  model: text-embedding-3-small
  dim: 1536

vector:
  size: 1536
  distance: Cosine

payload:
  - name: text
    type: string
  - name: source
    type: string
  - name: chunk_index
    type: integer

chunking:
  splitter: RecursiveCharacterTextSplitter
  chunk_size: 300
  chunk_overlap: 30

id_rule: uuid5(source + "#" + chunk_index)
